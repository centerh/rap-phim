<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rạp phim online</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>

<!-- Màn hình tạo nhân vật -->
<div id="lobby">
  <div class="card">
    <h1>🎬 Rạp phim online</h1>
    <div class="lobby-grid">
      <canvas id="preview" width="300" height="360"></canvas>
      <div class="form">
        <label>Tên <input id="name" maxlength="20" placeholder="Nhập tên..."></label>
        <label>Phòng <input id="room" maxlength="30" placeholder="main" value="main"></label>
        <div class="colors">
          <label>Da <input type="color" id="skin" value="#f1c27d"></label>
          <label>Tóc <input type="color" id="hair" value="#3b2a1a"></label>
          <label>Áo <input type="color" id="shirt" value="#3a7bd5"></label>
          <label>Quần <input type="color" id="pants" value="#2d3436"></label>
        </div>
        <label>Ảnh thiết kế áo (in lên áo)
          <input type="file" id="texture" accept="image/*">
        </label>
        <button id="clearTex" type="button" class="small">Xoá ảnh áo</button>
        <button id="enter" class="primary">Vào rạp →</button>
      </div>
    </div>
  </div>
</div>

<!-- Cảnh rạp -->
<div id="cssLayer"></div>
<canvas id="scene"></canvas>

<div id="screenPanel" class="hidden">
  <div class="bar">
    <input id="ytUrl" placeholder="Dán link YouTube rồi bấm Phát...">
    <button id="ytGo">Phát</button>
    <button id="playBtn" title="Phát / Tạm dừng">⏯</button>
    <button id="histBtn" title="Lịch sử chat">📜</button>
    <button id="viewBtn" title="Đổi góc nhìn (phím V)">👤 Góc 3</button>
    <button id="sizeBtn" title="Toàn màn hình (Esc để thoát)">⛶</button>
    <span id="count">👥 1</span>
  </div>
</div>
<div id="ytHolder"><div id="yt"></div></div>

<div id="chat" class="hidden">
  <div id="history" class="hidden"></div>
  <div id="log"></div>
  <input id="chatInput" maxlength="200" placeholder="Nhấn Enter để chat..." autocomplete="off">
</div>
<div id="menu" class="hidden">
  <div class="menu-card">
    <h2 id="menuTitle">🍽️ Menu</h2>
    <div id="menuItems"></div>
    <div class="menu-foot">
      <button id="menuClear">🧹 Dọn bàn</button>
      <button id="menuClose">Đóng</button>
    </div>
  </div>
</div>
<div id="actionMenu" class="hidden">
  <div id="actionName"></div>
  <button id="actPunch">👊 Đấm</button>
  <button id="actKick">🦶 Đá</button>
</div>
<div id="help" class="hidden">WASD: đi · Kéo chuột: xoay · V: góc nhìn · Click sofa: ngồi · Click bàn: gọi món · Click người: đấm/đá (hoặc F đấm, G đá) · Enter: chat</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="app.js"></script>
</body>
</html>
